name: Sync to Collins repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Collins repo
        run: |
          git remote add collins https://x-access-token:${{ secrets.COLLINS_TOKEN }}@github.com/Collonslokuka/BETZENITH.git
          git push collins main --force